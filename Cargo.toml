# A paged script-hash history needs a seekable, limited index scan, which bindex 0.1.2
# does not expose (its scan collects every matching txnum before returning). Vendored
# under vendor/ so a checkout of this repository builds exactly the code the deployed
# binary runs, instead of depending on a patch applied by hand.
